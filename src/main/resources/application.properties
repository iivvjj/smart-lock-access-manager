spring.application.name=ISST-Grupo25-Casas 
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false
server.compression.enabled=true
spring.web.resources.static-locations=classpath:/static/
spring.resources.static-locations=classpath:/static/,classpath:/public/,classpath:/resources/,classpath:/META-INF/resources/


# spring.datasource.url=jdbc:mysql://localhost:3306/isst_db?useSSL=false&serverTimezone=UTC
# spring.datasource.username=root
# spring.datasource.password=${SECRET_PASSWORD:}
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 🔹 Configurar MySQL como base de datos
spring.datasource.url=jdbc:mysql://localhost:3306/isst_db
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=${SECRET_PASSWORD:}

# 🔹 Configurar Hibernate para MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.datasource.initialization-mode=always
# spring.sql.init.mode=always
spring.sql.init.mode=never
spring.jpa.show-sql=true


